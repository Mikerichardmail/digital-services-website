    100% Transparent Rates • Starting from ₹500
  </text>
  
  <!-- Region Callout -->
  <text x="1050" y="485" text-anchor="end" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600">
