<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient Background -->
  <rect width="1200" height="630" fill="#0f172a" />
  
  <!-- Subtle Glow Orbs -->
  <circle cx="200" cy="150" r="280" fill="#2563eb" fill-opacity="0.25" filter="blur(80px)" />
  <circle cx="1000" cy="480" r="320" fill="#10b981" fill-opacity="0.2" filter="blur(90px)" />
  
  <!-- Outer Border Frame -->
  <rect x="40" y="40" width="1120" height="550" rx="32" stroke="#334155" stroke-width="2" stroke-opacity="0.6" />
  
  <!-- Badge -->
  <rect x="100" y="100" width="310" height="42" rx="21" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
  <circle cx="124" cy="121" r="6" fill="#10b981" />
  <text x="142" y="127" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" letter-spacing="0.5">134+ FAST DIGITAL SERVICES</text>
  
  <!-- Main Brand Title -->
  <text x="100" y="240" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="76" font-weight="900" letter-spacing="-1.5">HelpIt Digital Solutions</text>
  
  <!-- Tagline / Value Proposition -->
  <text x="100" y="320" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="500">
